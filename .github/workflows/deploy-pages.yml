name: Deploy Meu Volante PRO to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 1,4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CI Automated Tests & Syntax Check
        run: npm run ci

  deploy:
    if: github.repository == 'vitoriobergamobrazil/loterias-nasa-pro'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Falha aqui não derruba a publicação: fica a base já versionada.
      - name: Update official results
        continue-on-error: true
        run: |
          node scripts/atualizar-historico.mjs
          sed -i "s/historico-oficial.js?v=[0-9.]*/historico-oficial.js?v=$(date +%Y%m%d%H)/" index.html

      - name: Build CSS
        run: npm run build:css

      # Lista fechada: documentos internos, SQL e scripts não vão para o site.
      - name: Build site folder
        run: |
          mkdir -p dist/supabase
          cp -r download google37f87419eb6687ca.html index.html privacidade.html excluir-conta.html manifest.json sw.js CNAME icon-192.png icon-512.png icon-maskable-512.png css js .well-known dist/
          cp supabase/config.js dist/supabase/
          touch dist/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check published URLs
        run: |
          sleep 30
          curl -fsS -o /dev/null https://loterias.pd.dev.br/.well-known/assetlinks.json
          curl -fsS -o /dev/null https://loterias.pd.dev.br/privacidade.html
          test "$(curl -s -o /dev/null -w '%{http_code}' https://loterias.pd.dev.br/BACKEND_SETUP.md)" = "404"
