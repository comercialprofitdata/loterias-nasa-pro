name: Deploy Loterias NASA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run CI Automated Tests & Syntax Check
        run: npm run ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Lista fechada: documentos internos, SQL e scripts não vão para o site.
      - name: Build site folder
        run: |
          mkdir -p dist/supabase
          cp -r index.html privacidade.html excluir-conta.html manifest.json sw.js CNAME icon-192.png icon-512.png css js .well-known dist/
          cp supabase/config.js dist/supabase/
          touch dist/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check published URLs
        run: |
          sleep 30
          curl -fsS -o /dev/null https://loterias.pd.dev.br/.well-known/assetlinks.json
          curl -fsS -o /dev/null https://loterias.pd.dev.br/privacidade.html
          test "$(curl -s -o /dev/null -w '%{http_code}' https://loterias.pd.dev.br/BACKEND_SETUP.md)" = "404"
