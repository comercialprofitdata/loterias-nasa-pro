<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="liq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Volante de Loteria (base esquerda, fundo branco com borda escura para destacar em qualquer tema) -->
  <g transform="translate(8, 56) rotate(-18 32 32)">
    <rect x="4" y="6" width="54" height="60" rx="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3"/>
    <rect x="4" y="6" width="54" height="15" rx="4" fill="#10B981"/>
    <rect x="11" y="27" width="10" height="10" rx="2" fill="#E2E8F0" stroke="#334155" stroke-width="1.5"/>
    <rect x="26" y="27" width="10" height="10" rx="2" fill="#10B981"/>
    <rect x="41" y="27" width="10" height="10" rx="2" fill="#E2E8F0" stroke="#334155" stroke-width="1.5"/>
    <rect x="11" y="42" width="10" height="10" rx="2" fill="#E2E8F0" stroke="#334155" stroke-width="1.5"/>
    <rect x="26" y="42" width="10" height="10" rx="2" fill="#E2E8F0" stroke="#334155" stroke-width="1.5"/>
    <rect x="41" y="42" width="10" height="10" rx="2" fill="#10B981"/>
  </g>

  <!-- Gota esmeralda caindo no volante -->
  <path d="M56 54 C56 54 47 68 47 75 A9 9 0 0 0 65 75 C65 68 56 54 56 54 Z" fill="url(#liq)" stroke="#065F46" stroke-width="2"/>

  <!-- Frasco Erlenmeyer inclinado (topo direita) -->
  <g transform="translate(68, 42) rotate(-122)">
    <path d="M-10 -44 L10 -44 L10 -22 L34 26 A8 8 0 0 1 27 38 L-27 38 A8 8 0 0 1 -34 26 L-10 -22 Z" fill="url(#glass)" stroke="#0F172A" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="-14" y="-48" width="28" height="6" rx="3" fill="#CBD5E1" stroke="#0F172A" stroke-width="2.5"/>
    <path d="M-16 0 L24 0 L32 24 A6 6 0 0 1 26 34 L-26 34 A6 6 0 0 1 -32 24 Z" fill="url(#liq)" opacity="0.92"/>
  </g>

  <!-- Bolinhas coloridas de loteria (alto contraste para 16x16) -->
  <circle cx="88" cy="24" r="10" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="106" cy="36" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="84" cy="46" r="10" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="104" cy="58" r="10" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="66" cy="48" r="9" fill="#F97316" stroke="#FFFFFF" stroke-width="2"/>
</svg>
